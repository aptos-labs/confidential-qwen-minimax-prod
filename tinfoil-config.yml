cvm-version: 0.11.0
shim:
  upstream-container: litellm
  upstream-port: 8080
  paths:
  - /health/liveliness
  - /v1/models
  - /v1/chat/completions
  - /v1/videos/sync
  dummy-attestation: false
  publish-attestation: false
  authenticated: true
  authenticated-endpoints:
  - /v1/models
  - /v1/chat/completions
  - /v1/videos/sync
  tls-mode: cert-proxy
  tls-challenge: dns
  tls-own-san-domain: true
  control-plane: https://api.inference.aptoslabs.com/
  atc: http://10.0.2.2:8399
cvm-network:
  inbound-ports:
  - 443
cpus: 64
memory: 524288
gpus: 8
models:
- name: minimax-h3-fl2va
  repo: model@1332deb833241c6daa758b04c0e1ad631de41b190c386b7576267b986328d625
  mpk: 87721463756e43f0b64a59975b41e6798f43921cbfd4f69524be59ebb3a893a8_144051265536_a57648aa-2b9d-53d1-8572-5116af536194
- name: qwen3-omni-30b-a3b-instruct
  repo: Qwen/Qwen3-Omni-30B-A3B-Instruct@26291f793822fb6be9555850f06dfe95f2d7e695
  mpk: 146b75f36614f6c597c09c5f7b62acd0a99c4f5d21c31a590fbd6ca68d053acc_70530605056_3ac824a9-5ee0-5130-9f87-1b94ff497b11
networks:
  models: {}
containers:
- name: litellm
  image: litellm/litellm:main-stable@sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf
  restart: always
  networks:
  - models
  entrypoint:
  - /bin/sh
  - -c
  command:
  - |
    set -eu
    cat > /tmp/llm.yaml <<'LITELLM_CONFIG'
    model_list:
      - model_name: qwen3-omni
        litellm_params:
          model: openai/qwen3-omni
          use_in_pass_through: true
          api_base: http://vllm-omni-qwen:8000/v1
          api_key: "none"
      - model_name: minimax-h3-fl2va
        litellm_params:
          model: openai/minimax-h3-fl2va
          api_base: http://vllm-omni-minimax:8001/v1
          api_key: "none"
    general_settings:
      pass_through_endpoints:
        - path: /v1/videos/sync
          target: http://vllm-omni-minimax:8001/v1/videos/sync
          methods: [POST]
          forward_headers: true
        - path: /v1/chat/completions
          target: http://vllm-omni-qwen:8000/v1/chat/completions
          methods: [POST]
          forward_headers: true
    litellm_settings:
      drop_params: false
    LITELLM_CONFIG
    umask 077
    mkdir -p /tmp/atlas-gateway
    chmod 700 /tmp/atlas-gateway
    cat > /tmp/atlas-gateway/litellm_video_guard.py <<'VIDEO_METHOD_GUARD'
    """Guard video methods and preserve Qwen's native multimodal response stream."""

    from __future__ import annotations

    import json
    from collections.abc import Awaitable, Callable
    from typing import TYPE_CHECKING, Any

    from fastapi import Depends, HTTPException, Response
    from starlette.requests import Request
    from starlette.responses import JSONResponse
    from starlette.routing import Match, Route
    from starlette.types import Scope

    if TYPE_CHECKING:
        from fastapi import FastAPI

    VIDEO_PATH = "/v1/videos/sync"
    GUARD_NAME = "dual_model_video_method_guard"


    async def _reject_method(request: Request) -> JSONResponse:
        return JSONResponse(
            {
                "error": {
                    "message": "Use POST for synchronous video generation.",
                    "type": "invalid_request_error",
                }
            },
            status_code=405,
            headers={"Allow": "POST"},
        )


    class _NonPostVideoRoute(Route):
        def matches(self, scope: Scope) -> tuple[Match, Scope]:
            # Leave POST on LiteLLM's normal authenticated passthrough path.
            if scope.get("method") == "POST":
                return Match.NONE, {}
            return super().matches(scope)


    def install(app: FastAPI | None = None) -> None:
        runtime_install = app is None
        if app is None:
            # LiteLLM is installed only inside the pinned gateway image.
            from litellm.proxy.proxy_server import app as proxy_app  # type: ignore[import-not-found]

            app = proxy_app
        if any(getattr(route, "name", None) == GUARD_NAME for route in app.router.routes):
            raise RuntimeError("Video method guard registered more than once")
        # Empty methods means the route handles every non-POST verb, including
        # extension methods, without Starlette substituting its own Allow header.
        app.router.routes.insert(
            0, _NonPostVideoRoute(VIDEO_PATH, endpoint=_reject_method, methods=[], name=GUARD_NAME)
        )
        if runtime_install:
            _install_runtime_chat(app)


    def install_raw_chat(
        app: FastAPI,
        *,
        router_getter: Callable[[], Any],
        config_getter: Callable[..., Any],
        auth_dependency: Callable[..., Any],
        forward: Callable[..., Awaitable[Any]],
    ) -> None:
        """Use LiteLLM's raw handler, but only for explicitly configured chat deployments."""
        path = "/v1/chat/completions"
        authentication = Depends(auth_dependency)

        async def raw_chat(
            request: Request,
            fastapi_response: Response,
            user_api_key_dict: Any = authentication,
        ) -> Any:
            try:
                data = await request.json()
            except (json.JSONDecodeError, UnicodeDecodeError) as error:
                raise HTTPException(400, "Invalid JSON request") from error
            model = data.get("model") if isinstance(data, dict) else None
            if (
                not isinstance(model, str)
                or not model.strip()
                or len(model) > 256
                or len(model.encode("utf-8")) > 256
            ):
                raise HTTPException(400, "A valid model name is required")
            router = router_getter()
            if router is None:
                raise HTTPException(503, "Model router is not ready")
            if not router.get_model_list(model_name=model):
                raise HTTPException(404, "Unknown model")
            try:
                deployment = router.get_available_deployment_for_pass_through(model=model)
            except Exception as error:
                status = getattr(error, "status_code", 400)
                if status not in (400, 404, 429, 503):
                    status = 503
                raise HTTPException(status, "Model is unavailable for raw chat") from error
            params = deployment["litellm_params"]
            base = params.get("api_base")
            if (
                params.get("model") != f"openai/{model}"
                or not params.get("use_in_pass_through")
                or not isinstance(base, str)
                or not base
            ):
                raise HTTPException(503, "Incompatible raw chat deployment")
            # LiteLLM's raw handler consults the registered endpoint as well as the
            # selected deployment. Refuse drift rather than send another model's
            # request to the route's fixed target. Neither URL comes from the client.
            registered = config_getter(route=path, method="POST") or {}
            target = registered.get("passthrough_params", {}).get("target")
            if target != base.rstrip("/") + "/chat/completions":
                raise HTTPException(503, "Raw chat route does not match the selected deployment")
            return await forward(
                endpoint="chat/completions",
                request=request,
                fastapi_response=fastapi_response,
                user_api_key_dict=user_api_key_dict,
                base_target_url=base,
                api_key=params.get("api_key"),
            )

        app.add_api_route(path, raw_chat, methods=["POST"], name="dual_model_raw_chat")
        app.router.routes.insert(0, app.router.routes.pop())


    def _install_runtime_chat(app: FastAPI) -> None:
        # Imports stay in the runtime hook: Atlas does not depend on LiteLLM.
        import litellm  # type: ignore[import-not-found]
        from litellm.proxy import proxy_server  # type: ignore[import-not-found]
        from litellm.proxy.auth.user_api_key_auth import (  # type: ignore[import-not-found]
            user_api_key_auth,
        )
        from litellm.proxy.pass_through_endpoints.llm_passthrough_endpoints import (  # type: ignore[import-not-found]
            BaseOpenAIPassThroughHandler,
        )
        from litellm.proxy.pass_through_endpoints.pass_through_endpoints import (  # type: ignore[import-not-found]
            InitPassThroughEndpointHelpers,
        )

        async def forward(**kwargs: Any) -> Any:
            return await BaseOpenAIPassThroughHandler._base_openai_pass_through_handler(
                **kwargs, custom_llm_provider=litellm.LlmProviders.OPENAI
            )

        install_raw_chat(
            app,
            router_getter=lambda: proxy_server.llm_router,
            config_getter=InitPassThroughEndpointHelpers.get_registered_pass_through_route,
            auth_dependency=user_api_key_auth,
            forward=forward,
        )
    VIDEO_METHOD_GUARD
    export PYTHONPATH="/tmp/atlas-gateway${PYTHONPATH:+:$PYTHONPATH}"
    export LITELLM_WORKER_STARTUP_HOOKS=litellm_video_guard:install
    exec litellm --config /tmp/llm.yaml --port 8080 --host 0.0.0.0
  healthcheck:
    test:
    - CMD
    - python3
    - -c
    - |
      import urllib.error
      import urllib.request
      urllib.request.urlopen('http://127.0.0.1:8080/health/liveliness', timeout=3).close()
      try:
          urllib.request.urlopen('http://127.0.0.1:8080/v1/videos/sync', timeout=3).close()
      except urllib.error.HTTPError as error:
          assert error.code == 405 and error.headers.get('Allow') == 'POST'
      else:
          raise RuntimeError('Video method guard is missing')
    interval: 30s
    timeout: 10s
    start_period: 60m
  tmpfs:
    /tmp: size=2g,mode=1777,exec
