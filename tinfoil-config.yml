containers:
- healthcheck:
    interval: 30s
    start_period: 60m
    test:
    - CMD
    - python3
    - -c
    - |
      import urllib.error
      import urllib.request
      urllib.request.urlopen('http://127.0.0.1:8080/health/liveliness', timeout=3).close()
      try:
          urllib.request.urlopen('http://127.0.0.1:8080/v1/videos/sync', timeout=3).close()
      except urllib.error.HTTPError as error:
          assert error.code == 405 and error.headers.get('Allow') == 'POST'
      else:
          raise RuntimeError('Video method guard is missing')
    timeout: 10s
  image: ghcr.io/aptos-labs/confidential-qwen-minimax-paid-gateway@sha256:9de0c62233566f90b20df3644e54230ffb2bebf47051c15263e657f45aae70c4
  name: litellm
  networks:
  - models
  - gateway-egress
  restart: always
  secrets:
  - USAGE_REPORTER_SECRET
  tmpfs:
    /tmp: size=2g,mode=1777,exec
- command:
  - |
    CUDA_VISIBLE_DEVICES=4,5,6,7 exec vllm serve \
    /tinfoil/mpk/mpk-146b75f36614f6c597c09c5f7b62acd0a99c4f5d21c31a590fbd6ca68d053acc \
    --omni --trust-remote-code --host=0.0.0.0 --port=8000 \
    --served-model-name qwen3-omni \
    --init-timeout 1800 --stage-init-timeout 900 \
    --stage-overrides '{"1": {"num_replicas": 2, "devices": "1,2"}, "2": {"num_replicas": 1, "devices": "3"}}'
  entrypoint:
  - /bin/sh
  - -c
  env:
  - VLLM_WORKER_MULTIPROC_METHOD
  gpus: all
  healthcheck:
    interval: 30s
    start_period: 60m
    test:
    - CMD
    - curl
    - -sf
    - http://localhost:8000/health
    timeout: 10s
  image: ghcr.io/aptos-labs/confidential-qwen-minimax-qwen-metered@sha256:ae61f2365e44fc21604a9eb34438997db9f1f9ec8a6ea1f4589c906f7ba8311f
  ipc: private
  name: vllm-omni-qwen
  networks:
  - models
  restart: always
  runtime: nvidia
  shm_size: 64g
  tmpfs:
    /root: size=20g,mode=0700,exec
    /tmp: size=20g,mode=1777,exec
- command:
  - CUDA_VISIBLE_DEVICES=0,1,2,3 exec vllm serve /tinfoil/mpk/mpk-87721463756e43f0b64a59975b41e6798f43921cbfd4f69524be59ebb3a893a8/FL2VA --trust-remote-code --host=0.0.0.0 --num-gpus=4 --usp=4 --ring=1 --vae-patch-parallel-size=4 --vae-parallel-mode=tile --vae-use-tiling --port=8001 --omni --served-model-name minimax-h3-fl2va
  entrypoint:
  - /bin/sh
  - -c
  env:
  - VLLM_WORKER_MULTIPROC_METHOD
  - VLLM_OMNI_VIDEO_SYNC_TIMEOUT
  gpus: all
  healthcheck:
    interval: 30s
    start_period: 60m
    test:
