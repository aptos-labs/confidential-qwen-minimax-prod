cvm-version: 0.11.0
shim:
  upstream-container: vllm-omni
  upstream-port: 8080
  paths:
  - /health
  - /healthz
  - /v1/models
  - /v1/chat/completions
  - /v1/completions
  - /v1/videos
  - /v1/videos/*
  dummy-attestation: false
  publish-attestation: false
  authenticated: true
  authenticated-endpoints:
  - /v1/models
  - /v1/chat/completions
  - /v1/completions
  - /v1/videos
  - /v1/videos/*
  tls-mode: cert-proxy
  tls-challenge: dns
  tls-own-san-domain: true
  control-plane: https://api.inference.aptoslabs.com/
  atc: http://10.0.2.2:8399
cvm-network:
  inbound-ports:
  - 443
cpus: 64
memory: 524288
gpus: 8
models:
- name: minimax-h3-fl2va
  repo: model@1332deb833241c6daa758b04c0e1ad631de41b190c386b7576267b986328d625
  mpk: 87721463756e43f0b64a59975b41e6798f43921cbfd4f69524be59ebb3a893a8_144051265536_a57648aa-2b9d-53d1-8572-5116af536194
- name: qwen3-omni-30b-a3b-instruct
  repo: Qwen/Qwen3-Omni-30B-A3B-Instruct@26291f793822fb6be9555850f06dfe95f2d7e695
  mpk: 146b75f36614f6c597c09c5f7b62acd0a99c4f5d21c31a590fbd6ca68d053acc_70530605056_3ac824a9-5ee0-5130-9f87-1b94ff497b11
containers:
- name: vllm-omni
  image: vllm/vllm-omni:v0.28.0-x86_64@sha256:4780186f168af96634917208596675439fa71cb5ed3440a30e8c21ca1defc451
  runtime: nvidia
  gpus: all
  ipc: private
  shm_size: 128g
  restart: always
  env:
  - VLLM_WORKER_MULTIPROC_METHOD
  - VLLM_OMNI_VIDEO_SYNC_TIMEOUT
  command:
  - /bin/sh
  - -c
  - 'echo  | base64 -d > /tmp/mux.py; ( while true; do CUDA_VISIBLE_DEVICES=4,5,6,7 vllm serve /tinfoil/mpk/mpk-146b75f36614f6c597c09c5f7b62acd0a99c4f5d21c31a590fbd6ca68d053acc --omni --trust-remote-code --host=127.0.0.1 --port=8000 --init-timeout 1800 --stage-init-timeout 900 --stage-overrides ''{"1": {"num_replicas": 2, "devices": "1,2"}, "2": {"num_replicas": 1, "devices": "3"}}'' ; sleep 10; done ) & ( while true; do CUDA_VISIBLE_DEVICES=0,1,2,3 vllm serve /tinfoil/mpk/mpk-87721463756e43f0b64a59975b41e6798f43921cbfd4f69524be59ebb3a893a8/FL2VA --trust-remote-code --host=127.0.0.1 --num-gpus=4 --usp=4 --ring=1 --vae-patch-parallel-size=4 --vae-parallel-mode=tile --vae-use-tiling --port=8001 --omni ; sleep 10; done ) & ( while true; do python3 /tmp/mux.py ; sleep 3; done ) & wait'
  healthcheck:
    test:
    - CMD
    - curl
    - -sf
    - http://localhost:8080/healthz
    interval: 30s
    timeout: 10s
    start_period: 60m
  tmpfs:
    /tmp: size=40g,mode=1777,exec
    /root: size=20g,mode=0700,exec
