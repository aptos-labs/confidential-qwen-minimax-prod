[tool.pytest.ini_options]
testpaths = ["tests", "images/paid-gateway/tests", "images/moderation-worker/tests"]
pythonpath = ["images/paid-gateway", "images/moderation-worker"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"
mypy_path = ["images/paid-gateway", "images/moderation-worker"]

[[tool.mypy.overrides]]
module = ["torch", "transformers", "huggingface_hub", "uvicorn", "yaml"]
ignore_missing_imports = true
