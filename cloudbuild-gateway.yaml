# Submit an archive of the reviewed source commit, never a live workspace.
substitutions:
  _SOURCE_SHA: ''
  _IMAGE: us-docker.pkg.dev/aptos-registry/ccs-images-public/confidential-qwen-minimax-paid-gateway
steps:
  - id: test-publish-verify-gateway
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
      - SOURCE_SHA=${_SOURCE_SHA}
      - IMAGE=${_IMAGE}
    args:
      - -ceu
      - |
        [[ "$$SOURCE_SHA" =~ ^[0-9a-f]{40}$$ ]]
        command -v python3 || { apt-get update -qq && apt-get install -y python3; }
        docker build --platform linux/amd64 --target test images/paid-gateway
        docker build --platform linux/amd64 --target runtime \
          --label org.opencontainers.image.source=https://github.com/aptos-labs/confidential-qwen-minimax-prod \
          --label org.opencontainers.image.revision="$$SOURCE_SHA" \
          --label org.opencontainers.image.base.name=docker.io/litellm/litellm@sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf \
          --label org.opencontainers.image.base.digest=sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf \
          -t ccs-gateway:smoke -t "$$IMAGE:source-$$SOURCE_SHA" images/paid-gateway
        python3 scripts/smoke_image.py gateway ccs-gateway:smoke --local
        docker push "$$IMAGE:source-$$SOURCE_SHA"
        image_ref="$$(docker image inspect --format '{{index .RepoDigests 0}}' "$$IMAGE:source-$$SOURCE_SHA")"
        [[ "$$image_ref" == "$$IMAGE"@sha256:* ]]
        mkdir -p /tmp/anonymous-docker
        printf '{"auths":{}}\n' > /tmp/anonymous-docker/config.json
        docker --config /tmp/anonymous-docker pull "$$image_ref"
        python3 scripts/smoke_image.py gateway "$$image_ref"
        printf 'Published, anonymously pulled, and smoke-tested: %s\n' "$$image_ref"
images:
  - ${_IMAGE}:source-${_SOURCE_SHA}
serviceAccount: projects/aptos-cloudbuild/serviceAccounts/ccs-public-api-builder@aptos-cloudbuild.iam.gserviceaccount.com
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  sourceProvenanceHash: [SHA256]
timeout: 1800s
